services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: atelier
      POSTGRES_DB: atelier
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  # S3 uyumlu dosya deposu (yerel). MinIO'nun Docker Hub imajı yayından kalktığı için
  # SeaweedFS kullanılıyor; bkz. docs/karar-kayitlari/ADR-0001-teknoloji.md §Değişiklikler.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024
    ports: ["8333:8333", "9333:9333"]
    volumes: [s3data:/data]
volumes:
  pgdata:
  s3data:
