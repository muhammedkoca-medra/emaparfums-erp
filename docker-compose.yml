services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: atelier
      POSTGRES_DB: atelier
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atelier
      MINIO_ROOT_PASSWORD: atelier-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
volumes:
  pgdata:
  minio:
